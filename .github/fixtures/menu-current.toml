# Menu shapes neither demo has, for aria-current: a home entry, a pageRef, a
# parent with no url whose child lies outside it, and an external link.
# The array replaces the exampleSite's main menu rather than adding to it.
[menu]
  [[menu.main]]
    identifier = "home"
    name       = "Home"
    url        = "/"
    weight     = 5

  [[menu.main]]
    identifier = "posts"
    name       = "Posts"
    pageRef    = "/posts"
    weight     = 20

  [[menu.main]]
    identifier = "more"
    name       = "More"
    weight     = 30

  [[menu.main]]
    identifier = "tags"
    name       = "Tags"
    url        = "/tags/"
    parent     = "more"

  [[menu.main]]
    identifier = "source"
    name       = "Source"
    url        = "https://github.com/mehdilaruelle/hugo-theme-hello-friend-ai"
    parent     = "more"
