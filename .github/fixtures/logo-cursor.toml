# The logo cursor with something to say; the demo config sets none of them.
# A bare number is seconds.
[params.logo]
  logoCursorColor     = "#67a2c9"
  logoCursorColorDark = "#f0a35e"
  logoCursorAnimate   = "2"

# And a portrait width in a CSS function, which a list of units turned away.
[params.portrait]
  maxWidth = "clamp(80px, 20vw, 160px)"
