# The showcase's four menus with every url written with a leading slash, the
# way the README writes them. Under a subpath that spelling used to put the
# language in front of the subpath (/fr/subpath/showcase/posts/), and the demos
# write "posts/", so neither ever built it. Each language is restated whole:
# a menu array set here replaces the showcase's rather than adding to it.

[languages.en.menu]
    [[languages.en.menu.main]]
      identifier  = "about"
      name        = "About"
      url         = "/about/"
      weight      = 10
      hasChildren = true
    [[languages.en.menu.main]]
      identifier  = "me"
      name        = "About Me"
      url         = "/about/me/"
      parent      = "about"
    [[languages.en.menu.main]]
      identifier = "posts"
      name       = "Posts"
      url        = "/posts/"
      weight     = 20
    [[languages.en.menu.main]]
      identifier = "search"
      name       = "Search"
      url        = "/search/"
      weight     = 30

