# A site whose only menu is a non-main one, over the exampleSite.
#
# header.html tested `len .Site.Menus`, the map of every menu, so this shape
# rendered an empty <nav> and a working hamburger beside it. menu.js removes
# `disabled`, so below 684px that was a focusable control opening nothing.
#
# `main = []` because Hugo merges the menu table across config files rather
# than replacing it: declaring only [[menu.footer]] leaves the exampleSite's
# main menu in place and the fixture proves nothing.
[menu]
main = []
  [[menu.footer]]
    name   = "Imprint"
    url    = "/imprint/"
    weight = 10
