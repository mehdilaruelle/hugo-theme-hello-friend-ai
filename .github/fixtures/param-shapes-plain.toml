# Table params as plain values (logo = "img/logo.png"): warn, not abort.
baseURL = "https://example.com/subpath/"
title   = "Param shapes"
theme   = "hello-friend-ai"
defaultContentLanguage = "en"
enableRobotsTXT = true

[params]
  logo       = "img/logo.png"
  portrait   = "img/me.jpg"
  social     = "https://example.com/jane"
  commento   = "https://comments.example.org/js/commento.js"
  utterances = "owner/repo"
  footer     = true
  favicon    = "/favicon.png"
  author     = "Jane"
  ai         = false
  publisher  = "Acme Inc."

# A list where one value was expected, and a number where a percentage was.
[params.verification]
  google = ["token-a", "token-b"]
[params.fontFallback]
  sizeAdjust = 105

[languages.en]
  weight = 1
[languages.fr]
  weight = 2
