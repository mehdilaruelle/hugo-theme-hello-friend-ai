# Table params written as plain values (logo = "img/logo.png"): each has to
# warn, not abort. Apart from param-shapes.toml, which holds [params.logo].
# Its content has a page param build that is not a table, and an author list.
baseURL = "https://example.com/subpath/"
title   = "Param shapes"
theme   = "hello-friend-ai"
defaultContentLanguage = "en"

[params]
  logo       = "img/logo.png"
  portrait   = "img/me.jpg"
  social     = "https://example.com/jane"
  commento   = "https://comments.example.org/js/commento.js"
  utterances = "owner/repo"
  footer     = true
  favicon    = "/favicon.png"
  author     = "Jane"

[languages.en]
  weight = 1
[languages.fr]
  weight = 2
