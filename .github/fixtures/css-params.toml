# Params written into the stylesheet, each of a shape it cannot take: a colour
# carrying a rule of its own, and a length with a space in it. Each has to warn
# and stay out of the stylesheet. A bare number is a duration in seconds.
[params]
  [params.logo]
    logoCursorColor   = "#67a2c9}body{display:none"
    logoCursorAnimate = "2"
  [params.portrait]
    maxWidth = "120 px"
