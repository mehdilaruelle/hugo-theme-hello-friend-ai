name: Demo site

# The demo is built from neither docs/ nor the root Markdown files.
on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the demo site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hello-friend-ai

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: ./hello-friend-ai/.github/actions/setup-hugo

      # Two sites, one deployment. Pages publishes a single directory tree per
      # repository, so the second site is a directory inside the first.
      - name: Build the demo
        working-directory: hello-friend-ai/exampleSite
        run: |
          hugo --themesDir ../.. --gc --minify --panicOnWarning \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Build the showcase
        working-directory: hello-friend-ai/showcaseSite
        run: |
          hugo --themesDir ../.. --gc --minify --panicOnWarning \
            --config ../exampleSite/config.toml,config.toml \
            --baseURL "${{ steps.pages.outputs.base_url }}/showcase/"
          mv public ../exampleSite/public/showcase

      - name: Fail if a stylesheet did not make it into either site
        working-directory: hello-friend-ai/exampleSite
        run: |
          for dir in public public/showcase; do
            if ! ls "${dir}"/*.css >/dev/null 2>&1; then
              echo "No stylesheet in ${dir}." >&2
              exit 1
            fi
            # --minify strips the quotes around attribute values, so accept both.
            if ! grep -Eq 'rel="?stylesheet"?' "${dir}/index.html"; then
              echo "${dir}/index.html does not reference a stylesheet." >&2
              exit 1
            fi
          done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: hello-friend-ai/exampleSite/public

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
