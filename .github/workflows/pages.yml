name: Demo site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.164.0
  DART_SASS_VERSION: 1.102.0

jobs:
  build:
    name: Build the demo site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: hello-friend-ai

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo ${{ env.HUGO_VERSION }} (extended)
        run: |
          curl -sSLf -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Install Dart Sass ${{ env.DART_SASS_VERSION }}
        run: |
          curl -sSLf \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            | tar -xz
          echo "${PWD}/dart-sass" >> "${GITHUB_PATH}"

      # Two sites, one deployment. Pages publishes a single directory tree per
      # repository, so the second site is a directory inside the first.
      - name: Build the demo
        working-directory: hello-friend-ai/exampleSite
        run: |
          hugo --themesDir ../.. --gc --minify --panicOnWarning \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Build the showcase
        working-directory: hello-friend-ai/showcaseSite
        run: |
          hugo --themesDir ../.. --gc --minify --panicOnWarning \
            --config ../exampleSite/config.toml,config.toml \
            --baseURL "${{ steps.pages.outputs.base_url }}/showcase/"
          mv public ../exampleSite/public/showcase

      - name: Fail if a stylesheet did not make it into either site
        working-directory: hello-friend-ai/exampleSite
        run: |
          for dir in public public/showcase; do
            if ! ls "${dir}"/*.css >/dev/null 2>&1; then
              echo "No stylesheet in ${dir}." >&2
              exit 1
            fi
            # --minify strips the quotes around attribute values, so accept both.
            if ! grep -Eq 'rel="?stylesheet"?' "${dir}/index.html"; then
              echo "${dir}/index.html does not reference a stylesheet." >&2
              exit 1
            fi
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: hello-friend-ai/exampleSite/public

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
