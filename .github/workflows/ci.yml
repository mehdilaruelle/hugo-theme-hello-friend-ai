name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly canary against the newest Hugo, see the `latest` job below.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.164.0
  DART_SASS_VERSION: 1.102.0

jobs:
  pr-title:
    name: Conventional pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Check the pull request title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # i18n.html falls back to English, so a key that only ever reached en.toml
  # builds green and warns about nothing. Source only, no Hugo.
  i18n:
    name: Every language carries every key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7

      - name: Check the translations against en.toml
        run: node .github/scripts/check-i18n.mjs .

      - name: Check docs/svgs.md lists exactly the icons the theme draws
        run: node .github/scripts/check-svgs.mjs .

      # links.yml proves the switches it lists; this finds the ones it does not.
      - name: Check every switch is read through switch.html
        run: node .github/scripts/check-switches.mjs .

      # robots.txt before #237 passed the check above, so it has to fail it now.
      - name: The switch check fails on a switch read through an alias
        run: |
          root=$(mktemp -d)
          cp -r layouts exampleSite showcaseSite archetypes "$root"
          cp .github/fixtures/switch-through-alias.txt "$root/layouts/alias-fixture.txt"
          if out=$(node .github/scripts/check-switches.mjs "$root" 2>&1); then
            echo "$out"; echo "  BAD  the fixture passed"; exit 1
          fi
          want='layouts/alias-fixture.txt:4  site.Params.ai.train (through $ai)  read without switch.html'
          echo "$out" | grep -qF "$want" || { echo "$out"; echo "  BAD  wanted: $want"; exit 1; }
          echo "  the alias is followed, into a .txt template"

  build:
    name: Build exampleSite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
        with:
          path: hello-friend-ai

      - name: Install Hugo ${{ env.HUGO_VERSION }} (extended)
        run: |
          curl -sSLf -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Install Dart Sass ${{ env.DART_SASS_VERSION }}
        run: |
          curl -sSLf \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            | tar -xz
          echo "${PWD}/dart-sass" >> "${GITHUB_PATH}"

      - name: Show toolchain versions
        run: |
          hugo version
          sass --version

      - name: Build
        working-directory: hello-friend-ai/exampleSite
        run: hugo --themesDir ../.. --gc --minify --panicOnWarning

      # The showcase turns on everything the default demo leaves off, so a
      # template change that only breaks an optional feature still fails here.
      - name: Build the showcase
        working-directory: hello-friend-ai/showcaseSite
        run: |
          hugo --themesDir ../.. --gc --minify --panicOnWarning \
            --config ../exampleSite/config.toml,config.toml

      # A stylesheet can be emitted and still carry no rules — that is exactly
      # what the libsass fallback used to do, silently. Assert there is CSS in
      # it, not just a file.
      - name: The stylesheet has rules in it
        working-directory: hello-friend-ai/exampleSite
        run: |
          css=$(find public -name 'main-*.css' | head -1)
          [ -n "$css" ] || { echo "no stylesheet was emitted"; exit 1; }
          rules=$(tr -cd '{' < "$css" | wc -c)
          bytes=$(wc -c < "$css")
          echo "$css: $bytes bytes, $rules rule blocks"
          [ "$rules" -ge 200 ] || { echo "stylesheet carries almost no CSS"; exit 1; }

  no-dart-sass:
    name: Build fails clearly without Dart Sass
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
        with:
          path: hello-friend-ai

      - name: Install Hugo ${{ env.HUGO_VERSION }} (extended)
        run: |
          curl -sSLf -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      # The theme is written in the Sass module system, which only Dart Sass
      # implements. It used to fall back to libsass and ship a site with no
      # styles at all; it now refuses. This holds that contract.
      - name: The build refuses, and says why
        working-directory: hello-friend-ai/exampleSite
        run: |
          # timeout, not just an assertion: a hang here is a failure mode of its
          # own and should be reported as one rather than as a job timeout.
          set +e
          out=$(timeout 300 hugo --themesDir ../.. --gc --minify 2>&1)
          code=$?
          set -e
          echo "$out" | tail -20
          case "$code" in
            0)   echo "::error::expected the build to fail without Dart Sass, it succeeded"; exit 1 ;;
            124) echo "::error::the build hung instead of failing"; exit 1 ;;
          esac
          echo "$out" | grep -q "Dart Sass is required" \
            || { echo "::error::failed, but not with the message naming what to install"; exit 1; }

  # The README's PageSpeed scores are measured by hand; this re-measures them on
  # every change. The demo follows the system theme, so it is audited light; the
  # showcase sets defaultTheme = "dark".
  lighthouse:
    name: Lighthouse scores
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name != 'schedule'
    env:
      # 13, not the 12 that @lhci/cli bundles: 12 marks robots.txt's
      # Content-Signal line an error, and has no agentic-browsing category.
      LIGHTHOUSE_VERSION: 13.5.0
      SITE: http://localhost:8080/hugo-theme-hello-friend-ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hello-friend-ai
          persist-credentials: false

      - name: Install Hugo ${{ env.HUGO_VERSION }} (extended)
        run: |
          curl -sSLf -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Install Dart Sass ${{ env.DART_SASS_VERSION }}
        run: |
          curl -sSLf \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            | tar -xz
          echo "${PWD}/dart-sass" >> "${GITHUB_PATH}"

      # Laid out as Pages serves them: the demo under the repository's path, the
      # showcase inside it, and a favicon at the root for the browser's own
      # /favicon.ico request, which github.io answers and the demos do not.
      - name: Build both sites as Pages lays them out
        working-directory: hello-friend-ai
        run: |
          (cd exampleSite && hugo --themesDir ../.. --gc --minify --panicOnWarning \
            --baseURL "${SITE}/" -d "${RUNNER_TEMP}/www/hugo-theme-hello-friend-ai")
          (cd showcaseSite && hugo --themesDir ../.. --gc --minify --panicOnWarning \
            --config ../exampleSite/config.toml,config.toml \
            --baseURL "${SITE}/showcase/" -d "${RUNNER_TEMP}/www/hugo-theme-hello-friend-ai/showcase")
          cp .github/fixtures/site-overrides/static/favicon.ico "${RUNNER_TEMP}/www/"

      - name: Serve them
        run: |
          python3 -m http.server 8080 -d "${RUNNER_TEMP}/www" >/dev/null 2>&1 &
          for _ in $(seq 20); do curl -sf "${SITE}/" >/dev/null && exit 0; sleep 0.5; done
          echo "::error::the server never answered"; exit 1

      # The two articles hold a code span in a caption and in a callout, which
      # each fell under 4.5:1 in the dark theme. A slug follows its title, so a
      # page that moves fails here rather than being audited as a 404.
      - name: Audit
        run: |
          mkdir -p "${RUNNER_TEMP}/lh"
          i=0
          for path in \
            / /posts/ \
            /showcase/ /showcase/posts/ /showcase/ar/ \
            /showcase/posts/2026/01/everything-an-article-is-made-of/ \
            /showcase/posts/2026/02/diagrams-and-everything-else-on-this-page/
          do
            curl -sf -o /dev/null "${SITE}${path}" || { echo "::error::${path} is not served"; exit 1; }
            i=$((i + 1))
            npx --yes "lighthouse@${LIGHTHOUSE_VERSION}" "${SITE}${path}" --quiet \
              --chrome-flags="--headless=new" \
              --output=json --output-path="${RUNNER_TEMP}/lh/${i}.json"
          done

      - name: Every category but performance is 100
        run: node hello-friend-ai/.github/scripts/check-lighthouse.mjs "${RUNNER_TEMP}"/lh/*.json
  latest:
    name: Build exampleSite (latest Hugo, canary)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          path: hello-friend-ai

      - name: Resolve and install the newest Hugo and Dart Sass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hugo_version="$(gh api repos/gohugoio/hugo/releases/latest --jq .tag_name | sed 's/^v//')"
          sass_version="$(gh api repos/sass/dart-sass/releases/latest --jq .tag_name)"
          echo "Hugo ${hugo_version}, Dart Sass ${sass_version}"

          curl -sSLf -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${hugo_version}/hugo_extended_${hugo_version}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

          curl -sSLf \
            "https://github.com/sass/dart-sass/releases/download/${sass_version}/dart-sass-${sass_version}-linux-x64.tar.gz" \
            | tar -xz
          echo "${PWD}/dart-sass" >> "${GITHUB_PATH}"

      - name: Show toolchain versions
        run: |
          hugo version
          sass --version

      - name: Build
        working-directory: hello-friend-ai/exampleSite
        run: hugo --themesDir ../.. --gc --minify --panicOnWarning

      - name: Build the showcase
        working-directory: hello-friend-ai/showcaseSite
        run: |
          hugo --themesDir ../.. --gc --minify --panicOnWarning \
            --config ../exampleSite/config.toml,config.toml
