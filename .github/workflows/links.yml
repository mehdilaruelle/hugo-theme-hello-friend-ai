name: Links

# Nothing here reads docs/ or the root Markdown files.
on:
  push:
    branches: [master]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  internal-links:
    name: Internal links and assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: hello-friend-ai

      - uses: ./hello-friend-ai/.github/actions/setup-hugo

      # Built under a subpath on purpose: every URL bug found in this theme so
      # far was invisible at a domain root and only appeared once the site was
      # served from one.
      - name: Build under a subpath
        working-directory: hello-friend-ai/exampleSite
        run: hugo --themesDir ../.. --gc --minify --baseURL "https://example.com/subpath/"

      - name: Check every internal link and asset
        working-directory: hello-friend-ai/exampleSite
        run: node ../.github/scripts/check-links.mjs public https://example.com/subpath/

      - name: Check GitHub-style alerts are drawn, and every other blockquote left alone
        working-directory: hello-friend-ai/exampleSite
        run: node ../.github/scripts/check-invariants.mjs public alerts posts/2026/11/alerts-and-the-series-this-post-belongs-to/index.html

      # The showcase is where the options the default demo leaves off get
      # exercised — covers, thumbnails, the background image. Those are exactly
      # the paths that have gone wrong under a subpath before.
      - name: Build the showcase under a subpath
        working-directory: hello-friend-ai/showcaseSite
        run: |
          hugo --themesDir ../.. --gc --minify --config ../exampleSite/config.toml,config.toml \
            --baseURL "https://example.com/subpath/showcase/"

      - name: Check every internal link and asset in the showcase
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-links.mjs public https://example.com/subpath/showcase/

      # The build above is the regression guard -- a bare string aborted it.
      # These keep the fix from becoming "stop emitting the tags".
      - name: Check a single media file written on its own
        working-directory: hello-friend-ai/showcaseSite
        run: |
          page=$(find public -path '*single-media-file*' -name index.html | head -1)
          [ -n "$page" ] || { echo "  BAD  the fixture page was not built"; exit 1; }
          node ../.github/scripts/check-invariants.mjs public media "${page#public/}" \
            https://example.com/subpath/showcase/video/demo.mp4

      # A language code is not a country code — Ukrainian is uk, Ukraine is ua —
      # and naming the wrong one renders an empty square rather than falling
      # back to the language code, because the fallback only fires on a missing
      # entry.
      - name: Check every language names a flag that exists
        working-directory: hello-friend-ai
        run: node .github/scripts/check-flags.mjs .

      # The .fi-* rules are generated per site now, not vendored. A mapping,
      # rule or file that goes astray renders an empty square with nothing else
      # failing. The demo is the monolingual half of this: it must draw no flag
      # AND ship no rule — that is the 5.8 MB and the 46% of the stylesheet this
      # replaced.
      - name: Check every flag box has a rule and a file (showcase)
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-flag-css.mjs public https://example.com/subpath/showcase/

      - name: Check a monolingual site ships no flag CSS (demo)
        working-directory: hello-friend-ai/exampleSite
        run: node ../.github/scripts/check-flag-css.mjs public https://example.com/subpath/

      # A ";" between query parameters is not a separator any more: it absorbs
      # everything after it into the preceding value, and the build is silent.
      - name: Check the sharing links parse
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-sharing.mjs public

      # The icons carry no text and most of the svgs carry no <title>, so the
      # anchor's own label is the whole accessible name. It used to be
      # humanize, which named GitHub "Github" -- a wrong name is still a name,
      # so nothing failed.
      - name: Check every social link is named, and its icon is not
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-social.mjs public

      # The build succeeds whether or not the passthrough delimiters survive
      # Goldmark, so only an assertion on the built HTML catches a formula that
      # quietly became prose.
      - name: Check the maths survived Markdown
        working-directory: hello-friend-ai/showcaseSite
        run: |
          node ../.github/scripts/check-math.mjs public
          node ../.github/scripts/check-invariants.mjs public math

      # width and height on the element fix the used height, so a rule that
      # narrows the box stretches the picture unless height is released. The
      # markup is identical either way; only the geometry is wrong.
      - name: Check images keep their aspect ratio
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-image-sizing.mjs public

      - name: Check each SVG reserves the box it will fill
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-svg-sizing.mjs public

      # pre is the scroll container, and it used to be the positioned box too,
      # so the copy button and the language label travelled with the scrolled
      # code and ended up on top of it. Deleting the wrapper would build green
      # and quietly bring that back.
      - name: Check every code block has something to anchor its controls to
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-code-blocks.mjs public

      - name: Check the language label clears the copy button
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-invariants.mjs public copy-label

      - name: Check the focus ring, the status and the alert colours meet their contrast
        working-directory: hello-friend-ai
        run: |
          node .github/scripts/check-invariants.mjs exampleSite/public contrast
          node .github/scripts/check-invariants.mjs showcaseSite/public contrast

      # Open Graph and Twitter tags are written by two partials. They used to
      # take their picture from two different sources, so a site setting
      # params.images showed one image and named another on every page with a
      # cover — and nothing failed.
      # The base URL resolves the picture against the files on disk.
      - name: Check both halves of a social card name one published picture
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-cards.mjs public https://example.com/subpath/showcase/

      # Nothing else parses the XML the build writes, so a feed could stop
      # being XML and still ship — which is what an unescaped "]]>" in an
      # article did: it closed the CDATA section early and took the whole
      # document with it, not just the one item.
      - name: Check the XML outputs parse
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-feeds.mjs public

      - name: Check the example site's XML outputs parse
        working-directory: hello-friend-ai/exampleSite
        run: node ../.github/scripts/check-feeds.mjs public

      # A broken llms.txt is still a valid text file.
      - name: Check llms.txt and the Markdown copies
        working-directory: hello-friend-ai/showcaseSite
        run: |
          node ../.github/scripts/check-llms.mjs public https://example.com/subpath/showcase/ \
            --absent=https://example.com/subpath/showcase/kept-out/,https://example.com/subpath/showcase/kept-out-quoted/

      # A link in code is an example, so it is carried as the author wrote it.
      - name: Check llms-full.txt leaves links in code and footnotes as written
        working-directory: hello-friend-ai/showcaseSite
        run: |
          bad=0
          for snippet in '`[a span](commas.svg)`' '    [indented](commas.svg)' \
                         '    [in a list](commas.svg)' '> [in a quote](commas.svg)' \
                         '      [six in a list](commas.svg)' '[behind a quoted close](commas.svg)' \
                         '[^sizes]: Each size is read from the file itself.' \
                         '[Note]: neither is a line shaped like one, commas.svg and all.' \
                         '    The note goes on, with [the first of them](https://example.com/subpath/showcase/svg-sizes/commas.svg) again.' \
                         'Out of the quote, [the first of them](https://example.com/subpath/showcase/svg-sizes/commas.svg) once more.' \
                         '[escaped]: https://example.com/subpath/showcase/svg-sizes/commas.svg "the \"commas\" one"' \
                         '- [listed]: https://example.com/subpath/showcase/svg-sizes/commas.svg' \
                         '    - [nested]: https://example.com/subpath/showcase/svg-sizes/commas.svg' \
                         '- [ ]: commas.svg' '-     [shown]: commas.svg' \
                         'Literal text, not a link: \[text\](commas.svg).' \
                         'Nor this one: \[text](commas.svg).' \
                         '[n]: https://example.com/subpath/showcase/llms-links/escapes/../../svg-sizes/commas.svg'; do
            grep -qF -- "$snippet" public/llms-full.txt || { echo "  BAD  not carried as written: $snippet"; bad=1; }
          done
          # Links the link hook resolves in the HTML resolve in the copy too.
          grep -qF '[the page next door](https://example.com/subpath/showcase/kept-out/)' public/kept-out-quoted/index.md \
            || { echo "  BAD  /kept-out/ is left root-relative in the Markdown copy"; bad=1; }
          [ "$bad" = 0 ] && echo "  code and footnotes are carried as written, the links around them resolved"
          exit "$bad"

      - name: Check the Markdown copy carries front matter and code as written
        working-directory: hello-friend-ai/showcaseSite
        run: |
          md=public/md-copy-edges/index.md
          [ -f "$md" ] || { echo "  BAD  $md was not built"; exit 1; }
          bad=0
          for want in '# Learn C \#' '> \- a description that opens like a list' \
                      'as written: `&rsquo;`. So does a fence:' '<p>It&rsquo;s &mdash; written as entities</p>' \
                      '\+ this line is a paragraph, and a decoded "+" opening it would make it a' \
                      '    Its second paragraph: it’s decoded.' 'inside a plain fence, &rsquo; stays' \
                      'Out of the quote, it’s prose again.' '    Its second paragraph: it’s decoded as well.' \
                      'Under it, it’s prose.' 'Under that, it’s prose too.' \
                      '    echo it&rsquo;s code in a list item' 'After the list, it’s prose.'; do
            grep -qxF -- "$want" "$md" || { echo "  BAD  no line reading: $want"; bad=1; }
          done
          md=public/llms-links/text-edges/index.md
          grep -qx '    $ hugo new site demo' "$md" || { echo "  BAD  a body opening with indented code lost its indent"; bad=1; }
          grep -qF '\_\_init\_\_ and \*args' "$md" || { echo "  BAD  the summary is read as Markdown"; bad=1; }
          awk '/<details class="faq">/,/<\/details>/' "$md" | sed '$d' | grep -qx '' \
            && { echo "  BAD  a blank line inside the faq ends its HTML block"; bad=1; }
          grep -A2 -x 'hugo server' public/llms-full.txt | tail -1 | grep -qx '~~~' || { echo "  BAD  a fence left open swallows llms-full.txt"; bad=1; }
          grep -B1 -F 'llms.txt と同じ順序です' public/ja/llms-full.txt | head -1 | grep -qx '' \
            || { echo "  BAD  the truncation notice is glued to the line above"; bad=1; }
          [ "$bad" = 0 ] && echo "  the Markdown copy reads as the page does"
          exit "$bad"

      # With neither the note nor the llms-full line between them, a body
      # heading over a link list has the generated lists shape exactly.
      - name: Check llms.txt with no note and no llms-full
        working-directory: hello-friend-ai/showcaseSite
        run: |
          hugo --themesDir ../.. --gc --minify \
            --config ../exampleSite/config.toml,config.toml,config-plain.toml \
            --baseURL "https://example.com/subpath/showcase/" --destination public-plain
          node ../.github/scripts/check-llms.mjs public-plain https://example.com/subpath/showcase/

      # .content is the page layout class, not a prose wrapper.
      - name: Check no prose is wrapped in the page layout class
        working-directory: hello-friend-ai/showcaseSite
        run: |
          node ../.github/scripts/check-invariants.mjs public list-content

      # Nothing here renders CSS, so the rule itself is asserted.
      - name: Check the logo keeps its direction on an RTL page
        working-directory: hello-friend-ai/showcaseSite
        run: |
          node ../.github/scripts/check-invariants.mjs public logo-rtl ar/index.html

      # .TableOfContents is a non-empty string even with no headings.
      - name: Check no empty table of contents is rendered
        working-directory: hello-friend-ai/showcaseSite
        run: |
          node ../.github/scripts/check-invariants.mjs public toc

      - name: Check every navigation landmark is named, and no aside sits in an article
        working-directory: hello-friend-ai/showcaseSite
        run: |
          node ../.github/scripts/check-invariants.mjs public landmarks
          node ../.github/scripts/check-invariants.mjs ../exampleSite/public landmarks

      # Valid markup either way, so nothing else notices it.
      # relativeURLs: a relative font preload; no home: Person and article:author keep a URL.
      - name: Check head URLs under relativeURLs and with no home page
        working-directory: hello-friend-ai/showcaseSite
        run: |
          HUGO_RELATIVEURLS=true HUGO_DISABLEKINDS=home hugo --themesDir ../.. --gc --minify \
            --config ../exampleSite/config.toml,config.toml --destination public-relative
          for f in about/index.html kept-out-quoted/index.html; do
            [ "$(grep -cE 'rel=preload href=https://example.com|"url":""|"@id":"#person"|article:author" content>' "public-relative/$f")" = 0 ] \
              || { echo "  BAD  $f: an absolute font preload, or an empty author URL, or no page"; exit 1; }
          done
          echo "  head URLs are relative or complete"

      - name: Check no empty post-info is rendered
        working-directory: hello-friend-ai/showcaseSite
        run: |
          node ../.github/scripts/check-invariants.mjs public post-info

      - name: Check no HTML entity reaches the reader as text
        working-directory: hello-friend-ai/showcaseSite
        run: |
          node ../.github/scripts/check-invariants.mjs public entities

      - name: Check a tag in a title reaches the reader as text
        working-directory: hello-friend-ai/showcaseSite
        run: |
          node ../.github/scripts/check-invariants.mjs public title-html \
            posts/2025/12/using-details-in-a-title-with-quotes/index.html '<details>'
          node ../.github/scripts/check-invariants.mjs public title-code \
            posts/2025/12/the-b-element-and-a-kbd-tag/index.html '<b>' '<kbd>'
          node ../.github/scripts/check-invariants.mjs public title-plain \
            posts/2025/12/using-details-in-a-title-with-quotes/index.html 'Using <details> in a title, with “quotes”'
          node ../.github/scripts/check-invariants.mjs public title-plain \
            posts/2025/12/the-b-element-and-a-kbd-tag/index.html 'The <b> element, and a <kbd> tag'
          node ../.github/scripts/check-invariants.mjs public title-plain \
            posts/2025/12/a-title-that-opens-like-a-list/index.html '1. A title that opens like a list'

      # Nothing else here would notice: the markup is valid either way.
      - name: Check the site switches honour a quoted value
        working-directory: hello-friend-ai/showcaseSite
        run: |
          hugo --themesDir ../.. --gc --minify \
            --config ../exampleSite/config.toml,config.toml,config-quoted.toml \
            --baseURL "https://example.com/subpath/showcase/" --destination public-quoted
          post=public-quoted/posts/2026/01/everything-an-article-is-made-of/index.html
          bad=0
          # The pager assertion below wants to hear a count of zero, which is
          # also what a file that was never built reads as. Named, not counted.
          for f in public-quoted/index.html public-quoted/posts/index.html "$post"; do
            [ -f "$f" ] || { echo "  BAD  $f was not built — the markers below assert nothing"; bad=1; }
          done
          # -c counts matching lines, and minified markup puts several on one.
          count() { echo $(( $(grep -o "$1" "$2" 2>/dev/null | wc -l) )); }
          # Absent here proves nothing unless it is present in the default build.
          off() {
            [ "$(count "$1" "${2/public-quoted/public}")" != 0 ] || { echo "  BAD  $1 is not in the default build either"; bad=1; }
            n=$(count "$1" "$2")
            [ "$n" = 0 ] || { echo "  BAD  $3 is still on: $1 appears $n time(s) in $2"; bad=1; }
          }
          off thumbnail         public-quoted/posts/index.html "enableThumbnails"
          off excerpt           public-quoted/posts/index.html "enableListExcerpts"
          off feather-clock     "$post"                        "enableReadingTime"
          off sharing-buttons   "$post"                        "enableSharingButtons"
          # Both call sites: head.html writes theme-init, header.html the button.
          off theme-init        public-quoted/index.html       "enableThemeToggle"
          off theme-toggle      public-quoted/index.html       "enableThemeToggle"
          off language-switcher public-quoted/index.html       "enableGlobalLanguageMenu"
          # The author's name is also in the meta tags, so the footer link it is.
          off '>Jane Doe</a></span>' public-quoted/index.html  "footer.author"
          off 'CC BY-NC'          public-quoted/index.html       "footer.copyright"
          off feather-rss         public-quoted/index.html       "footer.rss"
          off 'class=related'     "$post"                        "related.enable"
          off '&copy;'            public-quoted/index.html       "footer.trademark"
          off logo__pathname      public-quoted/index.html       "logoCursorPathname"
          # A disable, like the pager: the cursor is visible by default, so off() has
          # nothing to find there. A quoted false has to leave it visible.
          [ "$(count logo__cursor public-quoted/index.html)" != 0 ] || { echo "  BAD  logoCursorDisabled: no cursor rendered, so nothing to hide"; bad=1; }
          n=$( (grep -oh 'logo__cursor{[^}]*visibility:hidden' public-quoted/*.css || true) | wc -l)
          [ "$n" = 0 ] || { echo "  BAD  logoCursorDisabled: a quoted false hid the cursor"; bad=1; }
          # A disable, so a quoted false has to leave the pager in place.
          n=$(count pagination__buttons "$post")
          [ "$n" != 0 ] || { echo "  BAD  disableReadOtherPosts: a quoted false disabled the pager"; bad=1; }
          # A quoted 0 means the default, as 0 does.
          grep -q '"content":"[^"]' public-quoted/index.json \
            || { echo "  BAD  searchContentLimit: a quoted 0 emptied the search index"; bad=1; }
          grep -q '^10 of ' public-quoted/llms-full.txt \
            || { echo "  BAD  llmsFullLimit: \"010\" did not keep 10 pages"; bad=1; }
          for one in css/custom.css js/custom.js; do
            [ "$(count "$one" public-quoted/index.html)" != 0 ] \
              || { echo "  BAD  a lone $one given as a string was not loaded"; bad=1; }
          done
          [ "$bad" = 0 ] && echo "  every site switch honours the quoted spelling"
          exit "$bad"

      # No demo configures a comment provider, so nothing else builds the branch
      # comments-on.html decides.
      - name: Check the comments switch across all three providers
        working-directory: hello-friend-ai/showcaseSite
        run: |
          hugo --themesDir ../.. --gc --minify \
            --config ../exampleSite/config.toml,config.toml,config-comments.toml \
            --baseURL "https://example.com/subpath/showcase/" --destination public-comments
          p=public-comments/posts/2026/01
          on=$p/a-video-where-a-gif-used-to-be/index.html
          off_bool=$p/long-title-no-cover/index.html
          off_quoted=$p/questions-the-theme-is-asked/index.html
          bad=0
          for f in "$on" "$off_bool" "$off_quoted"; do
            [ -f "$f" ] || { echo "  BAD  $f was not built — the markers below assert nothing"; bad=1; }
          done
          count() { echo $(( $(grep -o "$1" "$2" 2>/dev/null | wc -l) )); }
          for m in hello-friend-ai-ci.disqus.com commento.example.com example/hello-friend-ai-ci; do
            [ "$(count "$m" "$on")" != 0 ] || { echo "  BAD  $m is missing with comments unset, so its absence below proves nothing"; bad=1; }
            [ "$(count "$m" "$off_bool")" = 0 ] || { echo "  BAD  $m is on under comments: false"; bad=1; }
            [ "$(count "$m" "$off_quoted")" = 0 ] || { echo "  BAD  $m is on under comments: \"false\""; bad=1; }
          done
          [ "$bad" = 0 ] && echo "  every provider honours the comments switch, quoted or not"
          # Commento fills a <div>, Comentario 3 a web component.
          [ "$(count 'data-id-root' "$on")" = 1 ] && [ "$(count '<comentario-comments>' "$on")" = 0 ] \
            || { echo "  BAD  a Commento script does not get exactly the Commento markup"; bad=1; }
          HUGO_PARAMS_COMMENTO_URL="https://comments.example.org/comentario.js" \
            hugo --themesDir ../.. --gc --minify \
            --config ../exampleSite/config.toml,config.toml,config-comments.toml \
            --baseURL "https://example.com/subpath/showcase/" --destination public-comentario > /dev/null
          f=public-comentario/posts/2026/01/a-video-where-a-gif-used-to-be/index.html
          [ "$(count '<comentario-comments></comentario-comments>' "$f")" = 1 ] && [ "$(count 'data-id-root' "$f")" = 0 ] \
            && [ "$(count 'comments.example.org/comentario.js' "$f")" = 1 ] \
            || { echo "  BAD  comentario.js does not get its script, one <comentario-comments> and no data-id-root"; bad=1; }
          [ "$bad" = 0 ] && echo "  Commento gets its <div>, Comentario 3 its <comentario-comments>"
          exit "$bad"

      - name: Check utterances follows the page's theme unless one is named
        working-directory: hello-friend-ai/showcaseSite
        run: |
          hugo --themesDir ../.. --gc --minify \
            --config ../exampleSite/config.toml,config.toml,config-comments.toml,../.github/fixtures/utterances-follow.toml \
            --baseURL "https://example.com/subpath/showcase/" --destination public-utterances
          post=posts/2026/01/a-video-where-a-gif-used-to-be/index.html
          bad=0
          grep -q 'class=utterances-follow' "public-utterances/$post" || { echo "  BAD  the default theme did not get the following mount"; bad=1; }
          js=$(grep -o 'js/utterances[^" >]*\.js' "public-utterances/$post" | head -1)
          grep -qs 'set-theme' "public-utterances/$js" || { echo "  BAD  the post loads no script that tells utterances of a theme change"; bad=1; }
          grep -q 'theme=github-light' "public-comments/$post" || { echo "  BAD  a named theme lost the static client"; bad=1; }
          [ "$bad" = 0 ] && echo "  utterances follows the page by default, and a named theme stands"
          exit "$bad"

      - name: Check a quoted 0 keeps the default related limit
        working-directory: hello-friend-ai/showcaseSite
        run: |
          hugo --themesDir ../.. --gc --minify \
            --config ../exampleSite/config.toml,config.toml,config-quoted-zero.toml \
            --baseURL "https://example.com/subpath/showcase/" --destination public-quoted-zero
          post=posts/2026/01/everything-an-article-is-made-of/index.html
          for f in "public/$post" "public-quoted-zero/$post"; do
            [ -f "$f" ] || { echo "  BAD  $f was not built — the count below asserts nothing"; exit 1; }
          done
          items() { echo $(( $(grep -oP 'class=related__list>.*?</ul>' "$1" 2>/dev/null | grep -o '<li>' | wc -l) )); }
          want=$(items "public/$post")
          got=$(items "public-quoted-zero/$post")
          # Unset reads as 0 too, so the default build cannot vouch for the 5 on its own.
          # The showcase has more candidates than that, so 5 is the cap biting.
          [ "$want" = 5 ] || { echo "  BAD  the default build lists $want related posts, not the documented 5"; exit 1; }
          [ "$got" = "$want" ] || { echo "  BAD  related.limit = \"0\" lists $got, the default lists $want"; exit 1; }
          echo "  a quoted 0 keeps the default related limit"

      # A failed template prints the failure and the build stays green:
      # %!q(bool=true) went out in a heading, past every checker above.
      - name: Check no template failed silently (showcase)
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-markup.mjs public

      - name: Check no template failed silently (demo)
        working-directory: hello-friend-ai/exampleSite
        run: node ../.github/scripts/check-markup.mjs public

      # Every one of these is a thing the build reports nothing about. A page
      # can name two different URLs as its own, announce a card picture no
      # platform renders, or carry two contradictory robots directives, and
      # Hugo calls that a successful build — which is how four of the six got
      # in. Run against both demos: the showcase is the one with covers, four
      # languages, pagers and a search page.
      - name: Check the SEO invariants (showcase)
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-seo.mjs public

      - name: Check the SEO invariants (demo)
        working-directory: hello-friend-ai/exampleSite
        run: node ../.github/scripts/check-seo.mjs public

      # Stated twice, so assert both say the same. The demo is checked too: the
      # feature being off has to keep meaning an unchanged file.
      - name: Check robots.txt agrees with itself
        working-directory: hello-friend-ai
        run: |
          node .github/scripts/check-robots.mjs . exampleSite/public
          node .github/scripts/check-robots.mjs . showcaseSite/public

      # No demo config enables enableGitInfo, so this markup was never built.
      - name: Check the commit line survives enableGitInfo with no gitUrl
        working-directory: hello-friend-ai/exampleSite
        run: |
          hugo --themesDir ../.. --gc --destination public-git \
            --config config.toml,../.github/fixtures/git-info-no-url.toml \
            --baseURL "https://example.com/subpath/"
          node ../.github/scripts/check-links.mjs public-git https://example.com/subpath/
          node ../.github/scripts/check-invariants.mjs public-git git-line

      # No demo config defined a non-main menu, so this shape was never built.
      - name: Check a non-main menu alone renders no navigation
        working-directory: hello-friend-ai/exampleSite
        run: |
          hugo --themesDir ../.. --gc --destination public-menu \
            --config config.toml,../.github/fixtures/menu-footer-only.toml \
            --baseURL "https://example.com/subpath/"
          node ../.github/scripts/check-links.mjs public-menu https://example.com/subpath/
          node ../.github/scripts/check-invariants.mjs public-menu menu

      # The demos write "posts/", so the README's "/posts/" is only built here.
      - name: Check a leading-slash menu url under a subpath, in every language
        working-directory: hello-friend-ai
        run: |
          cd showcaseSite
          hugo --themesDir ../.. --gc --minify --destination public-menu-slash \
            --config ../exampleSite/config.toml,config.toml,../.github/fixtures/menu-leading-slash.toml \
            --baseURL "https://example.com/subpath/showcase/"
          node ../.github/scripts/check-links.mjs public-menu-slash https://example.com/subpath/showcase/
          # Absolute urls: no second /fr/; the English home is not current.
          node ../.github/scripts/check-invariants.mjs public-menu-slash menu-current fr/index.html "Tous les articles" English
          # A same-host absolute url can be current.
          node ../.github/scripts/check-invariants.mjs public-menu-slash menu-current fr/posts/index.html Articles=page "Tous les articles=page" English
          cd ../exampleSite
          hugo --themesDir ../.. --gc --minify --destination public-menu-slash \
            --config config.toml,../.github/fixtures/menu-leading-slash-subdir.toml \
            --baseURL "https://example.com/subpath/"
          node ../.github/scripts/check-links.mjs public-menu-slash https://example.com/subpath/

      - name: Check the menu marks the current page and the entry holding it
        working-directory: hello-friend-ai/exampleSite
        run: |
          hugo --themesDir ../.. --gc --minify --destination public-menu-current \
            --config config.toml,../.github/fixtures/menu-current.toml \
            --baseURL "https://example.com/subpath/"
          node ../.github/scripts/check-links.mjs public-menu-current https://example.com/subpath/
          check() { node ../.github/scripts/check-invariants.mjs public-menu-current menu-current "$@"; }
          check posts/index.html Posts=page
          check posts/2014/03/migrate-to-hugo-from-jekyll/index.html Posts=true
          check tags/go/index.html More=true Tags=true
          check about/index.html
          # uglyURLs: a list page is tags/index.html, its menu url /tags/.
          # The logo: no /index.html/ link, and "#top" stays as given.
          HUGO_UGLYURLS=true HUGO_PARAMS_LOGO_LOGOHOMELINK="#top" \
            hugo --themesDir ../.. --gc --minify --destination public-menu-ugly \
            --config config.toml,../.github/fixtures/menu-current.toml \
            --baseURL "https://example.com/subpath/"
          ugly() { node ../.github/scripts/check-invariants.mjs public-menu-ugly menu-current "$@"; }
          ugly index.html Home=page
          ugly tags/index.html More=true Tags=page
          ugly posts/index.html Posts=page
          ugly posts/2014/03/migrate-to-hugo-from-jekyll.html Posts=true
          ugly tags/go.html More=true Tags=true
          node ../.github/scripts/check-links.mjs public-menu-ugly https://example.com/subpath/
          grep -q '<a href=/subpath/#top>' public-menu-ugly/posts/index.html \
            || { echo "  BAD  the logo does not link /subpath/#top"; exit 1; }
          # More has two entries, unlike the demos' submenus.
          node ../.github/scripts/check-invariants.mjs public-menu-current submenu-panel

      # No demo lists more posts than a pager holds, so the order was never paged.
      - name: Check posts are paged and linked newest first
        working-directory: hello-friend-ai/exampleSite
        run: |
          hugo --themesDir ../.. --gc --destination public-pagers \
            --config config.toml,../.github/fixtures/pager-size-three.toml \
            --baseURL "https://example.com/subpath/"
          node ../.github/scripts/check-invariants.mjs public-pagers date-order posts /subpath/
          for pager in tags/index.html tags/page/2/index.html; do
            node ../.github/scripts/check-invariants.mjs public-pagers taxonomy-pager "$pager" "Previous page" "Next page"
          done
          # canonifyURLs: pager canonicals and prev/next keep the subpath.
          HUGO_CANONIFYURLS=true hugo --themesDir ../.. --gc --destination public-pagers-canon \
            --config config.toml,../.github/fixtures/pager-size-three.toml \
            --baseURL "https://example.com/subpath/"
          node ../.github/scripts/check-links.mjs public-pagers-canon https://example.com/subpath/

      # Shapes neither demo has: an unrendered section, a ProfilePage section, an emoji title.
      - name: Check the SEO invariants on the shapes the demos lack
        working-directory: hello-friend-ai/exampleSite
        run: |
          hugo --themesDir ../.. --gc --minify --destination public-seo-shapes \
            --contentDir ../.github/fixtures/seo-shapes \
            --config config.toml,../.github/fixtures/seo-shapes.toml
          node ../.github/scripts/check-seo.mjs public-seo-shapes
          # posts/control-characters.md holds bytes XML forbids.
          node ../.github/scripts/check-feeds.mjs public-seo-shapes
          grep -q '"@type":"ProfilePage"' public-seo-shapes/about/index.html \
            || { echo "  BAD  about/_index.md asked for ProfilePage and is not one"; exit 1; }
          echo "  a ProfilePage section is described as one"
          grep -qF '"description":"Notes on DevOps \u0026 SRE"' public-seo-shapes/index.html \
            || { echo "  BAD  markup in params.description reached the JSON-LD"; exit 1; }
          # A stray % must not end the build.
          f=public-seo-shapes/posts/2026/10/half-price-a-file-name-with-a-percent-sign/index.html
          for want in '<meta property="og:image" content="https://example.com/img/50%25off.png">' \
                      '<source src=https://example.com/audio/50%25off.mp3>'; do
            grep -qF "$want" "$f" || { echo "  BAD  no $want"; exit 1; }
          done
          grep -qF '"sameAs":["https://mastodon.example/@jane%zz"]' public-seo-shapes/index.html \
            || { echo "  BAD  a profile URL with a stray % is not in sameAs"; exit 1; }
          echo "  a stray % reads as itself"
          node ../.github/scripts/check-invariants.mjs public-seo-shapes title-plain \
            posts/2026/10/cheap-or-dear/index.html 'Cheap ($$) or dear ($$$$)?'

      - name: Check a url naming a file warns when the md copy would replace it, and llms.txt keeps no heading
        working-directory: hello-friend-ai/exampleSite
        run: |
          out=$(hugo --themesDir ../.. --gc --destination public-md-url \
            --contentDir ../.github/fixtures/md-url-file \
            --config config.toml,../.github/fixtures/md-url-file.toml 2>&1) || { echo "$out"; exit 1; }
          grep -q 'url "/legacy/page.html" names a file' <<< "$out" || { echo "$out"; echo "  BAD  no md-url-names-a-file warning"; exit 1; }
          echo "  the build warns that the md copy would replace the HTML"
          [ -f public-md-url/llms.txt ] && ! grep -qx '\*\*\*\*' public-md-url/llms.txt \
            || { cat public-md-url/llms.txt; echo "  BAD  an empty heading became a rule in llms.txt"; exit 1; }
          for want in '> **A quoted heading**' '- **A listed heading**'; do
            grep -qxF -- "$want" public-md-url/llms.txt || { cat public-md-url/llms.txt; echo "  BAD  no line reading: $want"; exit 1; }
          done

      - name: Check pictures written in Markdown are resized and measured
        working-directory: hello-friend-ai/exampleSite
        run: |
          hugo --themesDir ../.. --gc --minify --panicOnWarning --destination public-markdown-images \
            --contentDir ../.github/fixtures/markdown-images \
            --config config.toml,../.github/fixtures/markdown-images.toml \
            --baseURL "https://example.com/subpath/"
          node ../.github/scripts/check-invariants.mjs public-markdown-images markdown-images
          # A % portrait width reaches sizes as vw; imageSizes still sizes a cover.
          HUGO_PARAMS_PORTRAIT_PATH="img/an example.png" HUGO_PARAMS_PORTRAIT_MAXWIDTH="50%" HUGO_PARAMS_IMAGESIZES="99vw" \
            hugo --themesDir ../.. --gc --minify --destination public-portrait \
            --contentDir ../.github/fixtures/markdown-images \
            --config config.toml,../.github/fixtures/markdown-images.toml
          grep -q 'class="circle portrait"' public-portrait/index.html && grep -q 'sizes=50vw' public-portrait/index.html \
            || { echo "  BAD  the portrait has an invalid sizes"; exit 1; }
          grep -q 'post-cover><img[^>]*sizes=99vw' public-portrait/posts/2026/10/a-cover-named-like-a-glob/index.html \
            || { echo "  BAD  imageSizes does not reach the cover"; exit 1; }
          # The card names the cover, not the file its name matches as a glob.
          f=public-markdown-images/posts/2026/10/a-cover-named-like-a-glob/index.html
          for want in '<meta property="og:image" content="https://example.com/subpath/posts/2026/10/a-cover-named-like-a-glob/photo%20%5B1%5D.jpg">' \
                      '<meta property="og:image:width" content="1200">'; do
            grep -qF "$want" "$f" || { grep -o '<meta property="og:image[^>]*>' "$f"; echo "  BAD  no $want"; exit 1; }
          done
          echo "  a glob-like cover name is the card's picture"
          node ../.github/scripts/check-invariants.mjs public-markdown-images menu-current café/index.html Café=page

      - name: Check a post shows where it sits in its series
        working-directory: hello-friend-ai/exampleSite
        run: |
          hugo --themesDir ../.. --gc --minify --panicOnWarning --destination public-series \
            --contentDir ../.github/fixtures/series --baseURL "https://example.com/subpath/"
          check() { node ../.github/scripts/check-invariants.mjs public-series series "$@"; }
          check posts/2026/10/halfway/index.html "The Tour=Setting out|*Halfway|Wrapping up" "The Tour!=*Halfway|Wrapping up"
          check posts/2026/10/on-its-own/index.html
          check posts/2026/10/left-out-of-lists/index.html
          check notes/aside/index.html "Asides=An aside, first part|*An aside, second part"
          # A term of render: link pages only is unlisted and noindex; a described or populated one stays.
          p=public-series
          for f in tags/index.html tags/index.xml sitemap.xml; do
            [ -f $p/$f ] && ! grep -q 'never-written' $p/$f || { echo "  BAD  an empty term is listed in $f"; exit 1; }
            grep -q 'tags/described/' $p/$f || { echo "  BAD  a described term is missing from $f"; exit 1; }
          done
          grep -q '<meta name=robots content="noindex' $p/tags/never-written/index.html || { echo "  BAD  an empty term is indexable"; exit 1; }
          for t in described tour; do
            [ -f $p/tags/$t/index.html ] && ! grep -q 'name=robots content="noindex' $p/tags/$t/index.html || { echo "  BAD  the $t term is not indexable"; exit 1; }
          done
          hugo --themesDir ../.. --gc --minify --panicOnWarning --destination public-series-off \
            --contentDir ../.github/fixtures/series --baseURL "https://example.com/subpath/" \
            --config config.toml,../.github/fixtures/series-off.toml
          node ../.github/scripts/check-invariants.mjs public-series-off series posts/2026/10/halfway/index.html

      # The documented escape hatch, built here so CI has walked it.
      - name: Check robots.txt with the documented crawlers override
        working-directory: hello-friend-ai/exampleSite
        run: |
          hugo --themesDir ../.. --gc --destination public-ai \
            --config config.toml,../.github/fixtures/ai-custom-crawlers.toml
          node ../.github/scripts/check-robots.mjs .. public-ai --custom-groups

      # check-robots.mjs asserts the two halves agree, and a quoted "false" read
      # as yes makes them agree on the wrong answer.
      - name: Check robots.txt honours a quoted AI policy
        working-directory: hello-friend-ai/exampleSite
        run: |
          hugo --themesDir ../.. --gc --destination public-ai-quoted \
            --config config.toml,../.github/fixtures/ai-quoted.toml
          node ../.github/scripts/check-robots.mjs .. public-ai-quoted
          want='Content-Signal: search=no, ai-input=no, ai-train=no'
          tr -d '\r' < public-ai-quoted/robots.txt | grep -qx "$want" || {
            echo "  BAD  a quoted false was read as yes; wanted: $want"
            grep '^Content-Signal' public-ai-quoted/robots.txt
            exit 1
          }
          echo "  the quoted AI policy is declined, as written"

      # Nothing here renders CSS, so the compiled rule is what gets asserted.
      # Both quote forms because --minify leaves attributes unquoted, and the
      # value boundaries because column-reverse and startfoo otherwise pass.
      - name: Check a submenu label starts where its siblings do on a phone
        working-directory: hello-friend-ai/showcaseSite
        run: |
          node ../.github/scripts/check-invariants.mjs public submenu ar/index.html
          node ../.github/scripts/check-invariants.mjs public header ar/index.html

      - name: Check every gallery thumbnail is a named link to a square
        working-directory: hello-friend-ai/showcaseSite
        run: |
          node ../.github/scripts/check-invariants.mjs public gallery
          # A bracketed file name still gets the alt its front matter writes.
          grep -q 'alt="The lake again, from a file whose name holds brackets"' \
            public/posts/2026/02/a-gallery-from-a-page-bundle/index.html \
            || { echo "  BAD  05-lake [copy].jpg lost its front-matter alt"; exit 1; }

      - name: Check contentWidth reaches the stylesheet and the image sizes
        working-directory: hello-friend-ai
        run: |
          node .github/scripts/check-invariants.mjs showcaseSite/public content-width 960px
          node .github/scripts/check-invariants.mjs exampleSite/public content-width
          # Fallback faces cover Inter's scripts only, so Arabic is not rescaled.
          grep -q 'font-family:inter fallback;[^}]*unicode-range:' showcaseSite/public/main-*.css \
            || { echo "  BAD  an Inter fallback face with no unicode-range"; exit 1; }

      # Unminified on purpose: --minify drops an empty attribute, so a
      # minified build cannot observe this at all.
      - name: Check the logo cursor ships no style attribute
        working-directory: hello-friend-ai/exampleSite
        run: |
          hugo --themesDir ../.. --gc --destination public-cursor
          node ../.github/scripts/check-invariants.mjs public-cursor cursor-default
          hugo --themesDir ../.. --gc --destination public-cursor-set \
            --config config.toml,../.github/fixtures/logo-cursor.toml
          node ../.github/scripts/check-invariants.mjs public-cursor-set cursor-default
          node ../.github/scripts/check-invariants.mjs public-cursor-set cursor-styled \
            background-color=#67a2c9 animation-duration=2s
          node ../.github/scripts/check-invariants.mjs public-cursor-set cursor-dark '#f0a35e'
          grep -q 'portrait{max-width:clamp(80px,20vw,160px)}' public-cursor-set/main-*.css \
            || { echo "  BAD  a portrait width in clamp() was turned away"; exit 1; }

      # Built on the showcase, which holds the logo files.
      - name: Check a logo with a dark variant, and an inlined one
        working-directory: hello-friend-ai/showcaseSite
        run: |
          hugo --themesDir ../.. --gc --minify --destination public-logo-images \
            --config ../exampleSite/config.toml,config.toml,../.github/fixtures/logo-images.toml \
            --baseURL "https://example.com/subpath/showcase/"
          node ../.github/scripts/check-links.mjs public-logo-images https://example.com/subpath/showcase/
          node ../.github/scripts/check-invariants.mjs public-logo-images logo-images logo-light.svg logo-dark.svg
          hugo --themesDir ../.. --gc --minify --panicOnWarning --destination public-logo-inline \
            --config ../exampleSite/config.toml,config.toml,../.github/fixtures/logo-inline.toml \
            --baseURL "https://example.com/subpath/showcase/"
          node ../.github/scripts/check-invariants.mjs public-logo-inline logo-inline "Jane Doe & co" mark


      # Neither demo ships favicons or overrides a theme file, so these paths
      # were never built.
      - name: Check a site's favicons and overridden theme files are used
        working-directory: hello-friend-ai
        run: |
          rm -rf site-overrides && cp -r exampleSite site-overrides
          cp -r .github/fixtures/site-overrides/. site-overrides/
          mkdir -p site-overrides/assets/scss
          sed 's/^\$light-background: .*/$light-background: #abcdef;/' \
            assets/scss/_variables.scss > site-overrides/assets/scss/_variables.scss
          cd site-overrides
          hugo --themesDir ../.. --gc --minify --destination public-overrides \
            --baseURL "https://example.com/subpath/"
          node ../.github/scripts/check-links.mjs public-overrides https://example.com/subpath/
          node ../.github/scripts/check-invariants.mjs public-overrides favicons
          node ../.github/scripts/check-invariants.mjs public-overrides site-overrides '#abcdef'
          mv static mystatic
          hugo --themesDir ../.. --gc --minify --destination public-static-dir \
            --config config.toml,../.github/fixtures/favicon-static-dir.toml
          node ../.github/scripts/check-invariants.mjs public-static-dir favicons

      - name: Check a site with no favicon links the empty icon
        working-directory: hello-friend-ai
        run: |
          node .github/scripts/check-invariants.mjs exampleSite/public favicon-none

      - name: Check a wrong-shaped param warns instead of aborting the build
        working-directory: hello-friend-ai/exampleSite
        run: |
          # No copyright either: no empty <span>.
          out=$(HUGO_COPYRIGHT="" hugo --themesDir ../.. --gc --destination public-shapes \
            --config config.toml,../.github/fixtures/param-shapes.toml 2>&1) || { echo "$out"; exit 1; }
          for want in 'href="xmpp:jane@example.com"' 'href="matrix:u/jane:example.com"' \
                      'href="sgnl://signal.me/#p/&#43;33123456789"' 'href="tel:&#43;33123456789"'; do
            grep -qF "$want" public-shapes/index.html || { echo "  BAD  no $want"; exit 1; }
          done
          ! grep -q 'javascript:' public-shapes/index.html || { echo "  BAD  a javascript: link was written"; exit 1; }
          node ../.github/scripts/check-markup.mjs public-shapes
          echo "  contact schemes as given, javascript: dropped"
          for id in ogimage-shape verification-shape credentials-shape css-param-invalid portrait-width-invalid url-scheme-refused default-theme-value; do
            grep -q "$id" <<< "$out" || { echo "  BAD  no $id warning"; exit 1; }
          done
          grep -q 'src="https://plausible.io/js/script.js"' public-shapes/index.html \
            || { echo "  BAD  plausibleDataDomain alone gets no script"; exit 1; }
          [ "$(grep -c '<span></span>' public-shapes/index.html)" = 0 ] || { echo "  BAD  an empty footer entry, or no page"; exit 1; }
          ! grep -q 'data-theme=' public-shapes/index.html || { echo "  BAD  an unknown defaultTheme was written"; exit 1; }
          grep -q 'logo__cursor{animation-duration:0s}' public-shapes/main-*.css || { echo "  BAD  logoCursorAnimate = 0 was ignored"; exit 1; }
          # Plain-value table params, and a page param build that is not a table.
          out=$(hugo --themesDir ../.. --gc --destination public-shapes-plain \
            --config ../.github/fixtures/param-shapes-plain.toml \
            --contentDir ../.github/fixtures/param-shapes-plain 2>&1) || { echo "$out"; exit 1; }
          for id in logo-shape portrait-shape social-shape commento-shape utterances-shape footer-shape favicon-shape; do
            grep -q "$id" <<< "$out" || { echo "$out"; echo "  BAD  no $id warning"; exit 1; }
          done
          p=public-shapes-plain
          for want in posts/build-string/index.html posts/build-number/index.html fr/posts/build-number/index.html; do
            [ -f "$p/$want" ] || { echo "  BAD  $want was not built"; exit 1; }
          done
          grep -q 'build-string/' "$p/posts/index.html" || { echo "  BAD  a post with params.build is not listed"; exit 1; }
          grep -q 'build-number/' "$p/fr/posts/index.html" || { echo "  BAD  a translation with params.build is not listed"; exit 1; }
          echo "  a page param named build is built and listed, in either language"
          f="$p/posts/build-string/index.html"
          grep -qF '<meta name="author" content="Ann, Bob"' "$f" || { echo "  BAD  a list of authors is not joined"; exit 1; }
          grep -qF '"author":[{"@type":"Person","name":"Ann"},{"@type":"Person","name":"Bob"}]' "$f" \
            || { echo "  BAD  a list of authors is not one Person each"; exit 1; }
          echo "  a list of authors names each of them"

      - name: Check a table-shaped params.social
        working-directory: hello-friend-ai/exampleSite
        run: |
          hugo --themesDir ../.. --gc --destination public-social-map \
            --config config.toml,../.github/fixtures/social-map.toml \
            --baseURL "https://example.com/subpath/"
          node ../.github/scripts/check-invariants.mjs public-social-map social-map fixturehandle
