name: Links

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.164.0
  DART_SASS_VERSION: 1.102.0

jobs:
  internal-links:
    name: Internal links and assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          path: hello-friend-ai

      - name: Install Hugo ${{ env.HUGO_VERSION }} (extended)
        run: |
          curl -sSLf -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Install Dart Sass ${{ env.DART_SASS_VERSION }}
        run: |
          curl -sSLf \
            "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" \
            | tar -xz
          echo "${PWD}/dart-sass" >> "${GITHUB_PATH}"

      # Built under a subpath on purpose: every URL bug found in this theme so
      # far was invisible at a domain root and only appeared once the site was
      # served from one.
      - name: Build under a subpath
        working-directory: hello-friend-ai/exampleSite
        run: hugo --themesDir ../.. --gc --minify --baseURL "https://example.com/subpath/"

      - name: Check every internal link and asset
        working-directory: hello-friend-ai/exampleSite
        run: node ../.github/scripts/check-links.mjs public https://example.com/subpath/

      # The showcase is where the options the default demo leaves off get
      # exercised — covers, thumbnails, the background image. Those are exactly
      # the paths that have gone wrong under a subpath before.
      - name: Build the showcase under a subpath
        working-directory: hello-friend-ai/showcaseSite
        run: |
          hugo --themesDir ../.. --gc --minify --config ../exampleSite/config.toml,config.toml \
            --baseURL "https://example.com/subpath/showcase/"

      - name: Check every internal link and asset in the showcase
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-links.mjs public https://example.com/subpath/showcase/

      # A language code is not a country code — Ukrainian is uk, Ukraine is ua —
      # and naming the wrong one renders an empty square rather than falling
      # back to the language code, because the fallback only fires on a missing
      # entry.
      - name: Check every language names a flag that exists
        working-directory: hello-friend-ai
        run: node .github/scripts/check-flags.mjs .

      # A ";" between query parameters is not a separator any more: it absorbs
      # everything after it into the preceding value, and the build is silent.
      - name: Check the sharing links parse
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-sharing.mjs public

      # The build succeeds whether or not the passthrough delimiters survive
      # Goldmark, so only an assertion on the built HTML catches a formula that
      # quietly became prose.
      - name: Check the maths survived Markdown
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-math.mjs public

      # width and height on the element fix the used height, so a rule that
      # narrows the box stretches the picture unless height is released. The
      # markup is identical either way; only the geometry is wrong.
      - name: Check images keep their aspect ratio
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-image-sizing.mjs public

      # Open Graph and Twitter tags are written by two partials. They used to
      # take their picture from two different sources, so a site setting
      # params.images showed one image and named another on every page with a
      # cover — and nothing failed.
      - name: Check both halves of a social card name one picture
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-cards.mjs public

      # Nothing else parses the XML the build writes, so a feed could stop
      # being XML and still ship — which is what an unescaped "]]>" in an
      # article did: it closed the CDATA section early and took the whole
      # document with it, not just the one item.
      - name: Check the XML outputs parse
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-feeds.mjs public

      - name: Check the example site's XML outputs parse
        working-directory: hello-friend-ai/exampleSite
        run: node ../.github/scripts/check-feeds.mjs public

      # A broken llms.txt is still a valid text file.
      - name: Check llms.txt and the Markdown copies
        working-directory: hello-friend-ai/showcaseSite
        run: |
          node ../.github/scripts/check-llms.mjs public https://example.com/subpath/showcase/ \
            --absent=https://example.com/subpath/showcase/kept-out/,https://example.com/subpath/showcase/kept-out-quoted/

      # With neither the note nor the llms-full line between them, a body
      # heading over a link list has the generated lists shape exactly.
      - name: Check llms.txt with no note and no llms-full
        working-directory: hello-friend-ai/showcaseSite
        run: |
          hugo --themesDir ../.. --gc --minify \
            --config ../exampleSite/config.toml,config.toml,config-plain.toml \
            --baseURL "https://example.com/subpath/showcase/" --destination public-plain
          node ../.github/scripts/check-llms.mjs public-plain https://example.com/subpath/showcase/

      # A failed template prints the failure and the build stays green:
      # %!q(bool=true) went out in a heading, past every checker above.
      - name: Check no template failed silently (showcase)
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-markup.mjs public

      - name: Check no template failed silently (demo)
        working-directory: hello-friend-ai/exampleSite
        run: node ../.github/scripts/check-markup.mjs public

      # Every one of these is a thing the build reports nothing about. A page
      # can name two different URLs as its own, announce a card picture no
      # platform renders, or carry two contradictory robots directives, and
      # Hugo calls that a successful build — which is how four of the six got
      # in. Run against both demos: the showcase is the one with covers, four
      # languages, pagers and a search page.
      - name: Check the SEO invariants (showcase)
        working-directory: hello-friend-ai/showcaseSite
        run: node ../.github/scripts/check-seo.mjs public

      - name: Check the SEO invariants (demo)
        working-directory: hello-friend-ai/exampleSite
        run: node ../.github/scripts/check-seo.mjs public

      # Stated twice, so assert both say the same. The demo is checked too: the
      # feature being off has to keep meaning an unchanged file.
      - name: Check robots.txt agrees with itself
        working-directory: hello-friend-ai
        run: |
          node .github/scripts/check-robots.mjs . exampleSite/public
          node .github/scripts/check-robots.mjs . showcaseSite/public

      # The documented escape hatch, built here so CI has walked it.
      - name: Check robots.txt with the documented crawlers override
        working-directory: hello-friend-ai/exampleSite
        run: |
          hugo --themesDir ../.. --gc --destination public-ai \
            --config config.toml,../.github/fixtures/ai-custom-crawlers.toml
          node ../.github/scripts/check-robots.mjs .. public-ai --custom-groups
