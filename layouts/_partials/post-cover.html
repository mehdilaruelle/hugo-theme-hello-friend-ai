{{ $cover := partial "string-param.html" (dict "value" .Params.Cover "name" "cover") }}
{{ if $cover }}
  <figure class="post-cover">
    {{ partial "image.html" (dict "src" $cover "alt" (partial "title-plain.html" . | htmlEscape) "page" . "loading" "eager" "fetchpriority" "high") }}

    {{ if .Params.CoverCaption }}
      <figcaption class="center">{{ .Params.CoverCaption | markdownify }}</figcaption>
    {{ end }}
  </figure>
{{ end }}
