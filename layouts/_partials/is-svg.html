{{- /* Whether a URL names an SVG. No platform renders one on a social card, and
       Hugo answers neither .Width nor .Resize for one. */ -}}
{{- $path := "" -}}
{{- with partialCached "parse-url.html" . (printf "%v" .) }}{{ $path = .Path }}{{ end -}}
{{- return eq (lower (path.Ext $path)) ".svg" -}}
