baseURL = "https://example.com"
title   = "Hello Friend AI"
locale  = "en-US"
theme   = "hello-friend-ai"

# Shown in the footer, and in the feed's <copyright>. Markup is allowed: the
# footer renders it, and the feed reduces it to its text.
copyright = '<a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">CC BY-NC 4.0</a>'

archetypeDir = "archetypes"
contentDir   = "content"
dataDir      = "data"
layoutDir    = "layouts"
publishDir   = "public"

buildDrafts  = false
buildFuture  = false
buildExpired = false

enableRobotsTXT = true
enableGitInfo   = false
enableEmoji     = true
enableMissingTranslationPlaceholders = false
disableHugoGeneratorInject = false

# Nothing is disabled here; use disableKinds to turn off page kinds, e.g.
# disableKinds = ["rss", "sitemap", "404"]

[pagination]
  disableAliases = false
  pagerSize = 20
  path = 'page'

[services]
  [services.rss]
      # Maximum number of items in the RSS feed.
      limit = 42
      
#   [services.disqus]
#     shortname = 'your-disqus-shortname'
#   [services.googleAnalytics]
#     ID = 'G-MEASUREMENT_ID'

# Required for the maths support. Without it Goldmark treats a formula as
# ordinary Markdown: "\," becomes a plain comma and "_" opens emphasis, before
# KaTeX ever sees it.
#
# This cannot come from the theme. Hugo merges a theme's params but not its
# markup settings, so it has to live in your own configuration.
[markup]
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block  = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

[permalinks]
  posts = "/posts/:year/:month/:slug/"

[taxonomies]
  tag      = "tags"
  category = "categories"
  series   = "series"

# What the "Related posts" list matches on. Here and not in the theme because
# Hugo does not merge a theme's [related] block. An index weighted under
# threshold carries no match of its own: categories at 60 was inert.
[related]
  threshold    = 80
  includeNewer = true
  toLower      = true

  [[related.indices]]
    name   = "tags"
    weight = 100

  [[related.indices]]
    name   = "categories"
    weight = 80

  [[related.indices]]
    name   = "date"
    weight = 10

[params]
  dateform        = "Jan 2, 2006"
  dateformShort   = "Jan 2"
  dateformNum     = "2006-01-02"
  dateformNumTime = "2006-01-02 15:04"

  # Metadata mostly used in document's head
  #
  ogImage  = "img/example.png"

  # subtitle is appended to every <title>, after the site title.
  # description is what search results and social cards show.
  # homeSubtitle is the line under the heading on the front page.
  #
  # One language, so they live here. With more than one they move under
  # [languages.<code>.params], since they are text a visitor reads — see
  # docs/config.md, and the showcase site for a worked example.
  subtitle     = "Hello Friend AI Theme"
  description  = "Nice theme for homepages and blogs"
  homeSubtitle = "A Hugo theme powered by <strong>AI</strong>"

  # Set a background for the homepage
  # backgroundImage = "assets/images/background.jpg"

  # Prefix of link to the git commit detail page. GitInfo must be enabled.
  #
  # gitUrl = ""

  # Set disableReadOtherPosts to true in order to hide the links to other posts.
  #
  disableReadOtherPosts = false

  # Default color scheme
  #
  # Unset, the theme follows the operating system preference. Set to "dark" or
  # "light" to pick a side; a visitor using the toggle still overrides it.
  #
  # defaultTheme = "dark"

  # Enable theme toggle
  # 
  # This options enables the theme toggle for the theme. 
  # Per default, this option is off. 
  # The theme is respecting the prefers-color-scheme of the operating system. 
  # With this option on, the page user is able to set the scheme he wants. 
  enableThemeToggle = true

  # Sharing buttons
  #
  # There are a lot of buttons preconfigured. If you want to change them,
  # generate the buttons here: https://sharingbuttons.io
  # and add them into your own `layouts/partials/sharing-buttons.html`
  #
  enableSharingButtons = true

  # Reading time
  #
  # This option enables reading time part on post info
  #
  enableReadingTime = true

  # Global language menu
  #
  # Puts a globe in the header, beside the theme toggle, opening the list of
  # languages. Left on here although this site has only one, because it then
  # renders nothing at all — which is the point worth demonstrating. The
  # showcase site has four and shows what it looks like.
  #
  enableGlobalLanguageMenu = true

  # Integrate Javascript files or stylesheets by adding the url to the external assets or by
  # linking local files with their path relative to the static folder, e.g. "css/styles.css"
  #
  customCSS = []
  customJS  = []

  # Integrate Plausible.io
  # plausibleDataDomain = 'test.com'
  # plausibleScriptSource = 'https://plausible.io/js/script.js'

  # Browser UI tint on mobile. Only emitted when set.
  # themeColor = "#1b1c1d"

  # Which section the footer's RSS icon and the 404 page point at.
  # mainSections = ["posts"]

  # Proof of ownership for the search consoles, emitted on the home page only.
  # [params.verification]
  #   google = ""
  #   bing   = ""
  #   yandex = ""

  [params.author]
    name = "Jane Doe"
    # Optional, and goes into the Person structured data. See SEO in the README.
    jobTitle = "Platform Engineer"

  # Custom footer 
  # If you want, you can easily override the default footer with your own content. 
  #
  [params.footer]
    trademark = true
    rss = true
    copyright = true
    author = true

    topText = []
    bottomText = [
      "Powered by <a href=\"https://gohugo.io\">Hugo</a>",
      "Made with &#10084; by <a href=\"https://github.com/rhazdon\">Djordje Atlialp</a>",
      "Fork maintained by <a href=\"https://github.com/mehdilaruelle\">Mehdi Laruelle</a>"
    ]

  # Colours for favicons. Flat, because that is where they are read. The
  # browser UI tint is themeColor above, not here.
  #
  [params.favicon]
    # Safari's pinned-tab icon is a silhouette and takes its colour here.
    mask = "#1b1c1d"
    # The Windows tile.
    msapplication = "#1b1c1d"

  [params.logo]
    logoMark     = ">"
    logoText     = "$ cd /home/"
    logoHomeLink = "/"
    # Set true to remove the logo cursor entirely.
    # logoCursorDisabled = false
    # Set to a valid CSS color to change the cursor in the logo.
    # logoCursorColor    = "#67a2c9"
    # Set to a valid CSS time value to change the animation duration, "0s" to disable.
    # logoCursorAnimate  = "2s"
    # Append the current url pathname to logoText 
    # logoCursorPathname = true

  # # # # # # # # # # # # # # # # # # # # # # # # # # # # #  
  # Addon: Startpage portrait 
  # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  [params.portrait]
    path     = "/img/portrait.png"
    maxWidth = "120px"
    # alt is read aloud, so it is text like any other on the page: with more
    # than one language it moves under [languages.<code>.params.portrait].
    alt      = "The Hugo logo"

  # # # # # # # # # # # # # # # # # # # # # # # # # # # # #  
  # Addon: Commento
  # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  # Commento is more than just a comments widget you can embed — 
  # it’s a return to the roots of the internet. 
  # An internet without the tracking and invasions of privacy. 
  # An internet that is simple and lightweight. 
  # An internet that is focused on interesting discussions, not ads. 
  # A better internet.
  # Uncomment this to enable Commento.
  #
  # [params.commento]
  #   url = ""

  # # # # # # # # # # # # # # # # # # # # # # # # # # # # #  
  # Addon: Utteranc.es
  # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  # Utteranc.es is a lightweight comments widget built on GitHub issues.
  # See https://utteranc.es/ for documentation
  # Uncomment this to enable Utteranc.es.
  #
  # [params.utterances]
  #   Your GitHub repository
  #
  #   repository = ""
  #
  #   label used for GitHub issues
  #
  #   label      = ""
  # 
  #   Blog Post <-> Issue mapping. This parameter is optional. Possible values are:
  #      - pathname
  #      - url
  #      - title
  #      - og:title
  #      - issue number
  #      - specific term
  #
  #   issueTerm  = ""
  #
  #   Theme used: possible values are:
  #      - github-light
  #      - github-dark
  #      - preferred-color-scheme
  #      - github-dark-orange
  #      - icy-dark
  #      - dark-blue
  #      - photon-dark
  #      - boxy-light
  #      - gruvbox-dark
  #
  #   theme      = ""
  # 

  # # # # # # # # # # # # # # # # # # # # # # # # # # # # #  
  # Addon: Social icons
  # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
  #
  [[params.social]]
    name = "twitter"
    url  = "https://twitter.com/"

  [[params.social]]
    name = "email"
    url  = "mailto:nobody@example.com"

  [[params.social]]
    name = "github"
    url  = "https://github.com/"

  [[params.social]]
    name = "linkedin"
    url  = "https://www.linkedin.com/"

  [[params.social]]
    name = "stackoverflow"
    url  = "https://www.stackoverflow.com/"

  [[params.social]]
    name = "credly"
    url  = "https://www.credly.com/"

  [[params.social]]
    name = "sessionize"
    url  = "https://sessionize.com/"

# One language, so everything a visitor reads is set at the root: locale above,
# the three params in [params], the portrait alt text, and this menu.
#
# Adding a second language means moving them under [languages.<code>], menu
# included — a root menu applies to every language, and no single entry of it
# can then be translated. docs/config.md shows both shapes side by side, and the
# showcase site is the worked example, in four languages.
[menu]
  # Menu order follows weight, the usual Hugo mechanism.
  [[menu.main]]
    identifier  = "about"
    name        = "About"
    url         = "about/"
    weight      = 10
    hasChildren = true

  [[menu.main]]
    identifier  = "me"
    name        = "About Me"
    url         = "about/me/"
    parent      = "about"

  [[menu.main]]
    identifier = "posts"
    name       = "Posts"
    url        = "posts/"
    weight     = 20
