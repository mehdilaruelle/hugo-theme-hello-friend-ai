# The theme's text formats. A site pays for one only by asking for it in its
# own [outputs].
[outputFormats]
  [outputFormats.llms]
    mediaType      = "text/plain"
    baseName       = "llms"
    isPlainText    = true
    notAlternative = true

  [outputFormats.md]
    mediaType      = "text/markdown"
    baseName       = "index"
    isPlainText    = true
    notAlternative = true

  # The same pages llms.txt maps, carrying their text.
  [outputFormats.llmsfull]
    mediaType      = "text/plain"
    baseName       = "llms-full"
    isPlainText    = true
    notAlternative = true

[params]
  mainSections = ["posts"]

# What the theme needs of Hugo, so a site that cannot build it is told at
# startup rather than part way through. Dart Sass is needed as well and is not
# declarable here: it is a separate binary, which either edition of Hugo drives
# just as well, so head.html reports a missing one instead.
[module]
  [module.hugoVersion]
    min = "0.158.0"
