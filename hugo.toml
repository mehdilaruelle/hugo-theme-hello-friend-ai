# The theme's text formats. A site pays for one only by asking for it in its
# own [outputs].
[outputFormats]
  [outputFormats.llms]
    mediaType      = "text/plain"
    baseName       = "llms"
    isPlainText    = true
    notAlternative = true

  [outputFormats.md]
    mediaType      = "text/markdown"
    baseName       = "index"
    isPlainText    = true
    notAlternative = true

  # The same pages llms.txt maps, carrying their text.
  [outputFormats.llmsfull]
    mediaType      = "text/plain"
    baseName       = "llms-full"
    isPlainText    = true
    notAlternative = true

[params]
  mainSections = ["posts"]
