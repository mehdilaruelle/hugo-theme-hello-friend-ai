# The theme's text formats. A site pays for one only by asking for it in its
# own [outputs].
[outputFormats]
  [outputFormats.llms]
    mediaType      = "text/plain"
    baseName       = "llms"
    isPlainText    = true
    notAlternative = true

  [outputFormats.md]
    mediaType      = "text/markdown"
    baseName       = "index"
    isPlainText    = true
    notAlternative = true

  # The same pages llms.txt maps, carrying their text.
  [outputFormats.llmsfull]
    mediaType      = "text/plain"
    baseName       = "llms-full"
    isPlainText    = true
    notAlternative = true

[params]
  mainSections = ["posts"]

# What the theme needs of Hugo, so a site that cannot build it is told at
# startup rather than part way through. The extended edition is not a
# preference: the stylesheet is transpiled with Dart Sass, which only it
# carries, and head.html can report a missing one but not supply it.
[module]
  [module.hugoVersion]
    extended = true
    min      = "0.158.0"
