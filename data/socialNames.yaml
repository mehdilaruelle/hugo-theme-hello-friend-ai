# How a social network spells its own name.
#
# social-icons.html used to title every link with `humanize`, which only
# capitalises the first letter: "Github", "Linkedin", "Stackoverflow". Those
# titles are the link's whole accessible name -- most of the icons carry no
# <title> of their own -- so a screen reader read the misspelling aloud.
#
# Keyed by the lowercased params.social name. Only the entries humanize gets
# wrong are listed; anything absent falls back to humanize, so an unknown
# network still gets a name. An entry may override this with its own `label`.
