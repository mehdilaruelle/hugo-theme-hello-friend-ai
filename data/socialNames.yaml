# How a social network spells its own name.
#
# social-icons.html titled every link with `humanize`, which only capitalises
# the first letter: "Github", "Linkedin", "Stackoverflow". Most of the icons
# carry no <title>, so that title was the whole accessible name a screen reader
# had, and it read the misspelling aloud.
#
# Keyed by the lowercased params.social name; only the ones humanize gets wrong
# are listed. An entry's own `label` wins over this file.
