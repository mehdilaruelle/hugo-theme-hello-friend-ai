# Search needs the index, and the index is the home page rendered as JSON.
# llms, llmsfull and md are the theme's text formats.
#
# md on every kind, not on pages alone, or /posts/ has no Markdown to go to.
# Each list replaces Hugo's default for that kind, hence RSS named again.
[outputs]
  page     = ["HTML", "md"]
  home     = ["HTML", "RSS", "JSON", "llms", "llmsfull", "md"]
  section  = ["HTML", "RSS", "md"]
  taxonomy = ["HTML", "RSS", "md"]
  term     = ["HTML", "RSS", "md"]

# The showcase site: the theme with every option turned on.
#
# Not a second site to keep in sync. It is layered on top of the exampleSite
# configuration, and mounts the exampleSite content and static files, so the
# only things here are what differs:
#
#   cd showcaseSite
#   hugo --themesDir ../.. --config ../exampleSite/config.toml,config.toml
#
# Hugo merges configuration files rather than replacing them, so a second file
# can add and override, never remove. Everything below is something switched on.
#
# The point is coverage as much as marketing. A feature no demo exercises is a
# feature nobody notices is broken.

# Small enough that the posts here fill more than one pager. The exampleSite
# keeps 20 and never reaches a page two, so nothing built the pager canonical,
# the pager title or the pager heading until this line existed.
[pagination]
  pagerSize = 3

[params]
  ogImage = "img/example.png"
  # Every option below is off in the exampleSite, which is why it is here.
  backgroundImage  = "img/background.svg"
  # The light variant. Without it, light mode drops the image rather than
  # printing dark text over a dark picture.
  backgroundImageLight = "img/background-light.svg"
  enableThumbnails = true
  enableListExcerpts = true

  # The terms of reuse, once for the site. A page overrides either.
  license    = "https://creativecommons.org/licenses/by-nc-sa/4.0/"
  creditText = "Jane Doe"

  # The background is a dark image, so the page should arrive dark rather than
  # settle there. The toggle still overrides this, which is the point of having
  # both.
  defaultTheme = "dark"

  # Exercised here because nothing else did, and the path that builds these URLs
  # was broken on every page but the home one.
  # Relative on purpose. Without the site's base URL these resolve against the
  # page being served, so they reach only the home page — which check-links
  # catches, because it resolves href and src the same way a browser does.
  customCSS = ["css/custom.css"]
  customJS  = ["js/custom.js"]

  # The AI policy, set the way most people who want one want it.
  [params.ai]
    train = false
    cite  = true

  # The author as an entity rather than a name. knowsAbout says what she works
  # in and hasCredential what backs it up; both land in the Person node that the
  # home page, every article and the about page already share under one @id.
  #
  # The exampleSite gives her a name and a job title, and Hugo merges tables
  # across configuration files, so only what is new has to be named here.
  [params.author]
    description = "Writes about Hugo, and about the parts of the web that hold still."
    knowsAbout  = ["Hugo", "Static site generators", "Web typography"]

    # url is the credential, not the issuer: relative on purpose, so the path
    # that resolves it is exercised under a subpath rather than only at a root.
    [[params.author.credentials]]
      name     = "Certified Hugo Themer"
      category = "certification"
      url      = "/about/me/"
      issuer   = "Hugo"

    [[params.author.credentials]]
      name     = "MSc Typography"
      category = "degree"

  # The logo cursor, which nothing exercised before. logoCursorPathname appends
  # the current path to the logo text, so it changes as you move around.
  [params.logo]
    logoMark           = ">"
    logoText           = "$ cd /home/"
    logoHomeLink       = "/"
    logoCursorColor    = "#67a2c9"
    logoCursorAnimate  = "1.4s"
    logoCursorPathname = true

  # gitUrl and enableGitInfo are deliberately left off. They would tie every
  # build to the full commit history, and the commit they link to belongs to the
  # theme rather than to anything a visitor is reading.

  [params.footer]
    # bottomText replaces the list in the exampleSite rather than appending to
    # it, so the original lines are repeated here with the way back added.
    bottomText = [
      "Powered by <a href=\"https://gohugo.io\">Hugo</a>",
      "Made with &#10084; by <a href=\"https://github.com/rhazdon\">Djordje Atlialp</a>",
      "Fork maintained by <a href=\"https://github.com/mehdilaruelle\">Mehdi Laruelle</a>",
      "<a href=\"https://mehdilaruelle.github.io/hugo-theme-hello-friend-ai/\">← Back to the default demo</a>"
    ]

# Four languages, where the exampleSite has one. Two of them are here for a
# reason beyond translation: Japanese has no spaces between words, and Arabic
# reads right to left. Both are places a layout quietly falls apart.
#
# All four are declared in full, menus included. The exampleSite is monolingual
# and keeps its menu at the root, and a root menu applies to every language with
# no way to translate a single entry — so each language needs its own here, and
# the English one has to be restated to replace the inherited root menu rather
# than sit beside it.
[languages]
  [languages.en]
    weight = 1
    locale = "en-US"
    label  = "English"
  [languages.en.params]
    subtitle     = "Feature showcase"
    description  = "Every option the theme has, turned on at once"
    homeSubtitle = "Every switch flipped, so you can see what they do"
    llmsNote     = "A demonstration site for the Hello Friend AI theme. The articles exist to show what the theme does, not to be quoted as fact."
  [languages.en.params.portrait]
    alt = "The Hugo logo"
  [languages.en.menu]
    [[languages.en.menu.main]]
      identifier  = "about"
      name        = "About"
      url         = "about/"
      weight      = 10
      hasChildren = true
    [[languages.en.menu.main]]
      identifier  = "me"
      name        = "About Me"
      url         = "about/me/"
      parent      = "about"
    [[languages.en.menu.main]]
      identifier = "posts"
      name       = "Posts"
      url        = "posts/"
      weight     = 20
    [[languages.en.menu.main]]
      identifier = "search"
      name       = "Search"
      url        = "search/"
      weight     = 30

  [languages.fr]
    weight = 2
    locale = "fr-FR"
    label  = "Français"
  [languages.fr.params]
    # Only the French site sets images, and only so CI builds the one
    # configuration where the card halves used to disagree: site images plus a
    # page cover the card can show. typography.fr.md carries a raster cover for
    # that -- an SVG one is skipped for cards, and would agree either way.
    # English keeps ogImage, so both fallbacks stay exercised.
    images       = ["img/example.png"]
    subtitle     = "Vitrine des fonctionnalités"
    description  = "Toutes les options du thème, activées d’un coup"
    homeSubtitle = "Tous les interrupteurs enclenchés, pour voir ce qu’ils font"
    llmsNote     = "Site de démonstration du thème Hello Friend AI. Les articles sont là pour montrer ce que fait le thème, pas pour être cités."
  [languages.fr.params.portrait]
    alt = "Le logo Hugo"
  [languages.fr.menu]
    [[languages.fr.menu.main]]
      identifier  = "about"
      name        = "À propos"
      url         = "about/"
      weight      = 10
      hasChildren = true
    [[languages.fr.menu.main]]
      identifier  = "me"
      name        = "Qui suis-je"
      url         = "about/me/"
      parent      = "about"
    [[languages.fr.menu.main]]
      identifier = "posts"
      name       = "Articles"
      url        = "posts/"
      weight     = 20
    [[languages.fr.menu.main]]
      identifier = "search"
      name       = "Recherche"
      url        = "search/"
      weight     = 30

  [languages.ja]
    weight = 3
    locale = "ja-JP"
    label  = "日本語"
  # No abbreviated month exists in CLDR for either language, so "Jan" resolves
  # to an empty string and the list date came out as a bare day number.
  [languages.ja.params]
    dateformShort = "January 2"
    subtitle     = "機能ショーケース"
    description  = "テーマのすべてのオプションを一度に有効にしたサイト"
    homeSubtitle = "すべてのスイッチを入れた状態です"
    llmsNote     = "Hello Friend AI テーマのデモサイトです。記事はテーマの機能を示すためのもので、事実として引用するためのものではありません。"
    # One language capped, so the truncated shape is built, not just described.
    llmsFullLimit = 2
  [languages.ja.params.portrait]
    alt = "Hugo のロゴ"
  [languages.ja.menu]
    [[languages.ja.menu.main]]
      identifier  = "about"
      name        = "概要"
      url         = "about/"
      weight      = 10
      hasChildren = true
    [[languages.ja.menu.main]]
      identifier  = "me"
      name        = "自己紹介"
      url         = "about/me/"
      parent      = "about"
    [[languages.ja.menu.main]]
      identifier = "posts"
      name       = "記事"
      url        = "posts/"
      weight     = 20
    [[languages.ja.menu.main]]
      identifier = "search"
      name       = "検索"
      url        = "search/"
      weight     = 30

  # direction is what renders dir="rtl" on <html> and mirrors the layout.
  #
  # locale carries a territory like the other three, or the feed announces plain
  # "ar" and og:locale comes out without one.
  #
  # Modern Standard Arabic belongs to no single country, so any territory here
  # is an approximation. ar-001 is the exact CLDR code for it — 001 being the UN
  # code for the world — but Open Graph wants a two-letter country and renders
  # it as the invalid ar_001. ar-sa is valid everywhere, and no more of a
  # stretch than calling English en-us.
  [languages.ar]
    weight = 4
    locale = "ar-SA"
    label  = "العربية"
    direction = "rtl"
  # Day before month here, unlike Japanese: Hugo localises the month name but
  # never the order, which the layout string fixes.
  [languages.ar.params]
    dateformShort = "2 January"
    subtitle     = "عرض الميزات"
    description  = "كل خيارات القالب مُفعَّلة دفعة واحدة"
    homeSubtitle = "كل المفاتيح مُشغَّلة، لترى ما تفعله"
    llmsNote     = "موقع عرض توضيحي لقالب Hello Friend AI. المقالات موجودة لإظهار ما يفعله القالب، لا للاقتباس منها كحقائق."
  [languages.ar.params.portrait]
    alt = "شعار Hugo"
  [languages.ar.menu]
    [[languages.ar.menu.main]]
      identifier  = "about"
      name        = "حول"
      url         = "about/"
      weight      = 10
      hasChildren = true
    [[languages.ar.menu.main]]
      identifier  = "me"
      name        = "من أنا"
      url         = "about/me/"
      parent      = "about"
    [[languages.ar.menu.main]]
      identifier = "posts"
      name       = "المقالات"
      url        = "posts/"
      weight     = 20
    [[languages.ar.menu.main]]
      identifier = "search"
      name       = "بحث"
      url        = "search/"
      weight     = 30

# The showcase carries its own articles, so that every language shows the same
# list. The exampleSite is English only and deliberately so; mounting its content
# here would leave three of the four languages holding pages that exist in none
# of them.
#
# Its static files and assets are still mounted: the portrait, the video clip and
# the image the shortcode resolves all live there, and copying them would mean
# maintaining two of each.
#
# A mount replaces Hugo's default for that component, so the local directory has
# to be named alongside the exampleSite one or it stops being picked up. Leaving
# assets out is silent — nothing fails at build time, an image simply stops
# resolving.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "../exampleSite/static"
    target = "static"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "../exampleSite/assets"
    target = "assets"
  [[module.mounts]]
    source = "assets"
    target = "assets"
