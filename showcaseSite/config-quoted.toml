# Every site switch as a quoted string, which a template reads as true.
[params]
  enableThumbnails         = "false"
  enableListExcerpts       = "false"
  enableReadingTime        = "false"
  enableSharingButtons     = "false"
  enableThemeToggle        = "false"
  enableGlobalLanguageMenu = "false"
  disableReadOtherPosts    = "false"
  imageMaxWidth            = "0"
  searchContentLimit       = "0"
  llmsFullLimit            = "010"
  customCSS                = "css/custom.css"
  customJS                 = "js/custom.js"
  [params.portrait]
    maxWidth = "090px"
  [params.footer]
    trademark = "false"
    author    = "false"
    copyright = "false"
    rss       = "false"
    # Keeps the row, so each item is judged by its own switch, not the row's.
    topText   = ["top row kept"]
  [params.related]
    enable = "false"
  [params.logo]
    logoCursorDisabled = "false"
    logoCursorPathname = "false"
