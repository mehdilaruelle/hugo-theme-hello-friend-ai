# Every site switch written as a quoted string, the spelling a TOML or YAML
# value picks up when it is quoted. A template reads any non-empty string as
# true, so each of these used to mean the opposite of what it says.
[params]
  enableThumbnails         = "false"
  enableListExcerpts       = "false"
  enableReadingTime        = "false"
  enableSharingButtons     = "false"
  enableThemeToggle        = "false"
  enableGlobalLanguageMenu = "false"
  disableReadOtherPosts    = "false"
