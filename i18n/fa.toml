# Translations for Persian
# https://gohugo.io/content-management/multilingual/#translation-of-strings
#
# Persian reads right to left: set direction = "rtl" on the language, as for
# Arabic. Words like نوشته‌ها carry a zero-width non-joiner (U+200C) between
# their parts; it is part of the spelling, not stray whitespace.

# Generic
#
[postAvailable]
other = "به زبان‌های دیگر:"


# 404.html
#
[archives]
other = "بایگانی"

[home]
other = "خانه"

[notFound]
other = "اوه، صفحه پیدا نشد…"


# posts/single.html
#
# A noun after a number stays singular in Persian, so both forms read the same.
# `one` covers 0 as well as 1, which is why it keeps the number.
[readingTime]
one   = "{{ .Count }} دقیقه"
other = "{{ .Count }} دقیقه"

[tableOfContents]
other = "فهرست مطالب"

[wordCount]
one   = "{{ .Count }} واژه"
other = "{{ .Count }} واژه"

[lastModified]
other = "آخرین به‌روزرسانی"

